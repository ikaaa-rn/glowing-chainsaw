<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autumn Reads 🍓</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style id="st">
:root{--bg:#faf6ef;--card:#fffdf8;--ink:#2b2118;--mute:#7a6a5a;--line:#e8dfd0;--accent:#b4532a;--accent-ink:#fff;--shadow:0 2px 10px rgba(60,40,20,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--card:#221c16;--ink:#f1e8da;--mute:#a89a88;--line:#392f25;--accent:#e0784a;--accent-ink:#1b120c;--shadow:0 2px 10px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130f;--card:#221c16;--ink:#f1e8da;--mute:#a89a88;--line:#392f25;--accent:#e0784a;--accent-ink:#1b120c;--shadow:0 2px 10px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,"Times New Roman",serif;margin:0;line-height:1.15}
.wrap{max-width:960px;margin:0 auto;padding:28px 18px 60px}
.hero{text-align:center;padding:26px 0 30px}
.hero h1{font-size:clamp(34px,7vw,52px);font-weight:700}
.hero p{color:var(--mute);margin:10px 0 0}
.tiles{display:grid;grid-template-columns:1fr;gap:10px;max-width:560px;margin:0 auto}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 18px;text-align:left;cursor:pointer;box-shadow:var(--shadow);color:inherit;font:inherit;transition:transform .15s;display:flex;align-items:center;gap:12px;width:100%}
.tile:hover{transform:translateY(-3px)}
.tile .ic{font-size:22px;line-height:1}
.tile h2{font-size:18px;margin:0;flex:1}
.tile .n{color:var(--mute);margin:0;font-size:13px;white-space:nowrap}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.top h2{font-size:30px;flex:1;min-width:150px}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:#c0392b;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px}
.book{background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer}
.cover{aspect-ratio:2/3;border-radius:8px 12px 12px 8px;overflow:hidden;box-shadow:var(--shadow);background:var(--line);display:flex;align-items:center;justify-content:center;border-left:4px solid rgba(0,0,0,.18)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover span{font-family:Fraunces,Georgia,serif;font-size:44px;color:#fff;font-weight:700}
.book .t{font-weight:600;margin-top:8px;font-size:14px;line-height:1.3}
.book .a{color:var(--mute);font-size:13px}
.stars{color:var(--accent);letter-spacing:1px}
.empty{text-align:center;color:var(--mute);padding:50px 10px;border:1.5px dashed var(--line);border-radius:16px}
.reviews{display:grid;gap:16px}
.rev{display:flex;height:260px;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);cursor:pointer;text-align:left;color:inherit;width:100%}
.rev .cover{width:84px;height:126px;flex:none}
.rev .cover span{font-size:28px}
.rev .rev-content{min-width:0;flex:1}
.rev h3{font-size:19px;line-height:22px;height:44px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.rev p{margin:8px 0 0;white-space:pre-wrap;color:var(--ink);line-height:22px;height:66px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;overflow-wrap:anywhere}
.rev .rev-pages{height:20px}
.rev .read-review{display:block;color:var(--accent);font-size:12px;font-weight:700;margin-top:6px}
.rev:hover{border-color:var(--accent)}
.rev:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.rev .a{color:var(--mute);font-size:13px;height:20px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);padding:0;width:min(480px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
form{padding:22px;display:grid;gap:12px}
label{font-size:13px;color:var(--mute);display:grid;gap:5px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.pick{display:flex;gap:14px;align-items:center}
.pick .cover{width:70px;flex:none}
.pick .cover span{font-size:24px}
.rate{display:flex;gap:4px}
.rate button{background:none;border:0;font-size:28px;color:var(--line);padding:0 2px}
.rate button.on{color:var(--accent)}
.foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.note{color:var(--mute);font-size:12px;text-align:center;margin-top:34px}
:root{--bg:#fff0f3;--card:#fffafb;--ink:#4a1d2a;--mute:#a4687b;--line:#f6c9d4;--accent:#e63357;--accent-ink:#fff;--green:#4e9b5c;--shadow:0 4px 14px rgba(230,51,87,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0e17;--card:#3b1824;--ink:#ffe8ee;--mute:#dba5b4;--line:#5c2a3a;--accent:#ff6f8c;--accent-ink:#3a0b16;--green:#8fd69a;--shadow:0 4px 14px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#2a0e17;--card:#3b1824;--ink:#ffe8ee;--mute:#dba5b4;--line:#5c2a3a;--accent:#ff6f8c;--accent-ink:#3a0b16;--green:#8fd69a;--shadow:0 4px 14px rgba(0,0,0,.4)}
body{font-family:Nunito,"Trebuchet MS",system-ui,sans-serif;background-image:radial-gradient(var(--line) 1.6px,transparent 1.6px);background-size:24px 24px}
h1,h2,h3,.cover span{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif}
.hero h1{background:linear-gradient(90deg,var(--accent),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.5px}
.hero p{max-width:440px;margin:12px auto 0}
.tile{border:2px solid var(--line);border-radius:26px}
.tile:nth-child(odd){transform:rotate(-.4deg)}
.tile:nth-child(even){transform:rotate(.4deg)}
.tile:hover{transform:translateY(-2px) rotate(0)}
.tile .n:last-child{color:var(--green);font-weight:700}
.btn{box-shadow:0 3px 0 rgba(0,0,0,.15)}
.top h2{color:var(--accent)}
.cover{border-left-color:var(--green)}

/* PATH GAMBAR WATERMARK/LOGO DIGANTI KE image.png */
:root{--logo:url('image.png')}

.cover{position:relative}
.logo{
  width: 180px;            /* Ukuran diperbesar sedikit (sebelumnya 150px) */
  height: 180px;           /* Ukuran diperbesar sedikit (sebelumnya 150px) */
  margin: 0 auto -15px;    /* Jarak ke tulisan Autumn Reads didekatkan (sebelumnya 4px) */
  background: var(--logo) center/contain no-repeat;
  animation: bob 3.2s ease-in-out infinite;
  filter: drop-shadow(0 8px 10px rgba(230,51,87,.2));
}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.stat{display:inline-block;margin-top:14px;background:var(--card);border:2px dashed var(--line);border-radius:999px;padding:6px 16px;font-size:14px;font-weight:700;color:var(--green)}
.tile{background:color-mix(in srgb,var(--tc) 24%,var(--card))}
.tile:nth-child(1){--tc:#ff7fa8}.tile:nth-child(2){--tc:#8cc8f0}.tile:nth-child(3){--tc:#f7d96a}.tile:nth-child(4){--tc:#8fd69a}
.tile .ic{display:inline-block;font-size:24px}
.tile:hover .ic{animation:wig .5s}
@keyframes wig{25%{transform:rotate(-14deg) scale(1.2)}75%{transform:rotate(14deg) scale(1.2)}}
.pg{font-size:12px;color:var(--mute);font-weight:700;margin-top:2px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:99px}
.fall{position:fixed;top:-8vh;pointer-events:none;z-index:0;opacity:.55;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
.wrap{position:relative;z-index:1}
.btn:active{transform:translateY(2px)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion:reduce){.fall,.logo{animation:none}}
:root{--bg:#f2faff;--card:#fff;--ink:#3d2b52;--mute:#8b7a9e;--line:#cde7f7;--accent:#f2548f;--accent-ink:#fff;--green:#6fb67d;--blue:#7cc0ee;--shadow:0 4px 14px rgba(124,192,238,.28)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1830;--card:#27254a;--ink:#fdeefb;--mute:#bdb2dc;--line:#3c3966;--accent:#ff8fbd;--accent-ink:#2b1030;--green:#9fdcab;--blue:#8cc8f0;--shadow:0 4px 14px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#1a1830;--card:#27254a;--ink:#fdeefb;--mute:#bdb2dc;--line:#3c3966;--accent:#ff8fbd;--accent-ink:#2b1030;--green:#9fdcab;--blue:#8cc8f0;--shadow:0 4px 14px rgba(0,0,0,.4)}
.hero h1{background:linear-gradient(90deg,var(--accent),var(--blue),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.stk{position:absolute;left:4px;top:4px;font-style:normal;font-size:16px;line-height:1;background:rgba(255,255,255,.88);border-radius:999px;padding:4px 5px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.stks{display:flex;flex-wrap:wrap;gap:6px}
.stks button{width:38px;height:38px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:18px;padding:0;color:var(--mute)}
.stks button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--card));transform:scale(1.08)}
.quote{margin-top:12px;font-size:14px;color:var(--mute);font-style:italic}
#vb{padding:22px;overflow-wrap:anywhere}.vh{display:flex;gap:16px;margin-bottom:12px}.vh .cover{width:96px;flex:none}.vh h3{font-size:22px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
.hero .hi{font-size:clamp(17px,3.6vw,21px);font-weight:700;color:var(--ink);max-width:560px}
.hero .aes{font-size:13px;letter-spacing:.3px;line-height:1.8;max-width:560px}
.lnk{background:none;border:0;padding:0 2px;color:var(--accent);font-weight:700;text-decoration:underline dotted}
.lmsg{margin:0;font-size:13px;color:var(--accent);min-height:1em}
#ldlg form{gap:12px}
@media (max-width:600px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px}.grid .cover span{font-size:24px}.grid .stk{font-size:11px;padding:2px 3px;left:2px;top:2px}.book .t{font-size:12px;margin-top:5px;overflow-wrap:anywhere}.book .a,.grid .pg{font-size:10.5px}.grid .stars{font-size:10px;letter-spacing:0}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<dialog id="dlg">
<form id="f" method="dialog" onsubmit="return false">
<h3 id="dt">A new book, yay! 🍓</h3>
<div class="pick">
<div class="cover" id="pv"><span>＋</span></div>
<label style="flex:1">Cover photo 📸
<input type="file" id="file" accept="image/*"></label>
</div>
<label>Title<input id="title" required></label>
<label>Author<input id="author"></label>
<div class="row"><label>Total pages 📄<input id="pages" type="number" min="1" inputmode="numeric" placeholder="320"></label><label id="curl">Current page<input id="cur" type="number" min="0" inputmode="numeric" placeholder="120"></label></div>
<label>Cover sticker ✨</label><div class="stks" id="stks"></div>
<label>Status
<select id="status">
<option value="read">Finished 🍓</option>
<option value="reading">Currently reading 🍂</option>
<option value="wish">Book wishlist 🎀</option>
</select></label>
<div id="rwrap">
<label>Rating ⭐</label>
<div class="rate" id="rate"></div>
<label style="margin-top:10px">My review 💭<textarea id="review" placeholder="The plot twist, the feelings, the favorite quotes… write it all here."></textarea></label>
</div>
<div class="foot">
<button class="btn danger" id="del" type="button">Remove 🥀</button>
<button class="btn ghost" id="cancel" type="button">Cancel</button>
<button class="btn" id="save" type="button">Save 🍓</button>
</div>
</form>
</dialog>
<dialog id="vdlg"><div id="vb"></div></dialog>
<dialog id="ldlg">
<form id="lf" onsubmit="return false">
<h3 id="lt">Owner login ✦</h3>
<p class="lmsg" id="lmsg"></p>
<label>Email<input id="lemail" type="email" autocomplete="email"></label>
<label id="lpw">Password<input id="lpass" type="password" autocomplete="current-password" minlength="6"></label>
<div class="foot">
<button class="btn ghost" id="lcancel" type="button">Cancel</button>
<button class="btn" id="lgo" type="submit">Log in</button>
</div>
</form>
</dialog>

<script id="main">
(function(){
// SUPABASE CREDENTIALS - JANGAN LUPA ISI DUA BARIS INI
var SUPABASE_URL = "https://zjvglbqchhpnkfflldsn.supabase.co";
var SUPABASE_KEY = "sb_publishable_qWjoXTwUz35UclKTz5sarQ_sgJ733JW";
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var LOCAL_KEY='rakbuku:v1';
var books=[], view='home', editing=null, cover='', rating=0, stk='', owner=false, loaded=false, user=null;

function toast(t){var e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e)}e.textContent=t;e.className='show';clearTimeout(toast.t);toast.t=setTimeout(function(){e.className=''},4000)}

async function load(){
  try {
    var res = await sb.from('books').select('*').order('created_at', {ascending: false});
    books = res.data || [];
    var sessionRes = await sb.auth.getSession();
    user = sessionRes.data?.session?.user || null;
    owner = !!user;
    loaded = true;
    render();
  } catch(e) {
    loaded = true;
    render();
    toast('Could not load the shelf 🥺');
  }
}

function localBooks(){try{var l=JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]');return Array.isArray(l)?l:[]}catch(e){return[]}}
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var COLORS=['#b4532a','#3d6b5e','#5b4b8a','#a1405a','#2f5d8a','#8a6d1f','#4d6a2f'];

function coverHTML(b){
if(b.cover)return '<div class="cover"><img alt="" src="'+esc(b.cover)+'">'+stkHTML(b)+'</div>';
var h=0,t=b.title||'?';for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;
return '<div class="cover" style="background:'+COLORS[Math.abs(h)%COLORS.length]+'"><span>'+esc(t.charAt(0).toUpperCase())+'</span>'+stkHTML(b)+'</div>';
}
function stars(n){return n?'<span class="stars">'+'★'.repeat(n)+'☆'.repeat(5-n)+'</span>':''}
var SECTIONS={
read:{name:'Finished',ic:'🍓',st:'read',empty:'No finished books yet 🥺 one chapter at a time!'},
review:{name:'Review',ic:'💌',st:'read',empty:'No reviews yet 💭 finished books with a review show up here.'},
reading:{name:'Currently Reading',ic:'🍂',st:'reading',empty:'Nothing on the nightstand right now 🍂'},
wish:{name:'Book Wishlist',ic:'🎀',st:'wish',empty:'The wishlist is empty for now 🎀'}
};
function list(k){
if(k==='review')return books.filter(function(b){return b.status==='read'&&b.review&&b.review.trim()});
return books.filter(function(b){return b.status===SECTIONS[k].st});
}
function plural(n,w){return n.toLocaleString('en-US')+' '+w+(n===1?'':'s')}
function stkHTML(b){return b.stk?'<em class="stk">'+esc(b.stk)+'</em>':''}
function pgHTML(b){var p=+b.pages||0,c=+b.cur||0;if(!p)return '';
if(b.status==='reading'){var pc=Math.min(100,Math.round(c/p*100));return '<div class="pg">📄 '+c+'/'+p+' pages ('+pc+'%)</div><div class="bar"><i style="width:'+pc+'%"></i></div>'}
return '<div class="pg">📄 '+plural(p,'page')+'</div>'}
function statText(){var r=books.filter(function(b){return b.status==='read'}),tp=r.reduce(function(s,b){return s+(+b.pages||0)},0);
return '🍓 '+plural(r.length,'book')+' finished · '+plural(tp,'page')+' read'}
var LBL={read:'🍓 Finished',reading:'🍂 Currently reading',wish:'🎀 Book wishlist'};

function ownerBar(){
if(!owner)return '<p class="note" style="margin-top:6px">˚₊‧ thanks for peeking at my shelf ‧₊˚ <button class="lnk" id="login" type="button">✦</button></p>';
var lb=localBooks();
return (lb.length?'<div style="text-align:center;margin-top:10px"><button class="btn" id="import">⇪ Import '+plural(lb.length,'book')+' saved in this browser</button></div>':'')+'<p class="note" style="margin-top:8px">Owner mode ✦ '+esc(user&&user.email||'')+' · only you can add or edit books. <button class="lnk" id="logout" type="button">Log out</button></p>'}

function openView(b){
$('#vb').innerHTML='<div class="vh">'+coverHTML(b)+'<div><h3>'+esc(b.title)+'</h3><div class="a">'+esc(b.author)+'</div><div>'+(b.status==='read'?stars(b.rating):'')+'</div>'+pgHTML(b)+'<div class="pg">'+LBL[b.status]+'</div></div></div>'+(b.review?'<p style="white-space:pre-wrap;margin:0 0 8px">'+esc(b.review)+'</p>':'')+'<div class="foot"><button class="btn" id="vc" type="button">Close</button></div>';
$('#vc').onclick=function(){$('#vdlg').close()};$('#vdlg').showModal()}

function render(){
var a=$('#app');
if(view==='home'){
var h='<div class="hero"><div class="logo" role="img" aria-label="Autumn Reads logo"></div><h1>Autumn Reads 🍓🍂</h1>'+
'<p class="hi">h͟a͟low! ⋆｡˚ this is my l͜i͡ttle bookish world ₊˚⊹♡</p>'+
'<p class="aes">ꕤ ⠀Chapter ⁰⁴:⁴⁴ ˖ ࣪ ⟡ ⠀Speaks in: Footnotes &amp; Daydreams.<br>(Bookmark No. ∞) ᯓ★ ⠀Pressed petals between every page. ⠀⋆˙⟡ ꒰ᐢ. .ᐢ꒱</p>'+
'<div class="stat">'+(loaded?statText():'˚₊‧ opening the shelf ‧₊˚')+'</div></div><div class="tiles">';
['read','review','reading','wish'].forEach(function(k){
h+='<button class="tile" data-go="'+k+'"><div class="ic">'+SECTIONS[k].ic+'</div><h2>'+SECTIONS[k].name+'</h2><div class="n">'+plural(list(k).length,'book')+' 🍓</div></button>';
});
a.innerHTML=h+'</div>'+ownerBar();
return;
}
var S=SECTIONS[view],items=list(view);
var h='<div class="top"><button class="btn ghost" data-go="home">← Back</button><h2>'+S.ic+' '+S.name+'</h2>'+(owner?'<button class="btn" id="add">＋ Add book</button>':'')+'</div>';
if(!items.length)h+='<div class="empty">'+S.empty+'</div>';
else if(view==='review'){
h+='<div class="reviews">'+items.map(function(b){
return '<button class="rev" type="button" aria-haspopup="dialog" data-id="'+esc(b.id)+'">'+coverHTML(b)+'<div class="rev-content"><h3>'+esc(b.title)+'</h3><div class="a">'+esc(b.author)+'</div><div>'+stars(b.rating)+'</div><div class="rev-pages">'+pgHTML(b)+'</div><p>'+esc(b.review)+'</p><span class="read-review">Read full review →</span></div></button>';
}).join('')+'</div>';
}else{
h+='<div class="grid">'+items.map(function(b){
return '<button class="book" data-id="'+esc(b.id)+'">'+coverHTML(b)+'<div class="t">'+esc(b.title)+'</div><div class="a">'+esc(b.author)+'</div>'+(b.status==='read'?'<div>'+stars(b.rating):'')+pgHTML(b)+'</button>';
}).join('')+'</div>';
}
a.innerHTML=h;
}

function drawRate(){
$('#rate').innerHTML=[1,2,3,4,5].map(function(i){return '<button type="button" data-r="'+i+'" class="'+(i<=rating?'on':'')+'">★</button>'}).join('');
}
function drawPreview(){
var b={title:$('#title').value||'?',cover:cover,stk:stk};
$('#pv').outerHTML=coverHTML(b).replace('class="cover"','class="cover" id="pv"');
}
function syncStatus(){var s=$('#status').value;$('#rwrap').style.display=s==='read'?'block':'none';$('#curl').style.display=s==='reading'?'grid':'none'}

// emot wajah
function drawStk(){$('#stks').innerHTML=['','😊','😂','😡','😭','🥺','😍','😎','😴'].map(function(s){return '<button type="button" data-s="'+s+'" class="'+(s===stk?'on':'')+'">'+(s||'∅')+'</button>'}).join('')}

function openDlg(b){
editing=b||null;stk=b?b.stk||'':'';cover=b?b.cover||'':'';rating=b?b.rating||0:0;
$('#dt').textContent=b?'Edit book ✏️':'A new book, yay! 🍓';
$('#title').value=b?b.title:'';$('#author').value=b?b.author:'';
$('#status').value=b?b.status:(SECTIONS[view]?SECTIONS[view].st:'read');
$('#review').value=b?b.review||'':'';$('#pages').value=b&&b.pages?b.pages:'';$('#cur').value=b&&b.cur?b.cur:'';$('#file').value='';
$('#del').style.display=b?'':'none';
drawRate();drawStk();drawPreview();syncStatus();$('#dlg').showModal();
}

function resize(file,cb){
var r=new FileReader();
r.onload=function(){var im=new Image();im.onload=function(){
var w=360,sc=Math.min(1,w/im.width),c=document.createElement('canvas');
c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82));
};im.src=r.result};
r.readAsDataURL(file);
}

function openLogin(msg){
$('#lmsg').textContent=msg||'';
if(!$('#ldlg').open)$('#ldlg').showModal();
}

$('#lf').addEventListener('submit',async function(){
var em=$('#lemail').value.trim(),pw=$('#lpass').value;
var res = await sb.auth.signInWithPassword({email: em, password: pw});
if(res.error){
  $('#lmsg').textContent = res.error.message;
} else {
  user = res.data.user;
  owner = true;
  $('#ldlg').close();
  load();
  toast('Welcome back ✦ edit away!');
}
});
$('#lcancel').addEventListener('click',function(){$('#ldlg').close()});

document.addEventListener('click',function(e){
var t=e.target.closest('[data-go],[data-id],[data-r],[data-s],#add,#import,#login,#logout');
if(!t)return;
if(t.dataset.go){view=t.dataset.go;render();window.scrollTo(0,0)}
else if(t.dataset.r){var n=+t.dataset.r;rating=rating===n?0:n;drawRate()}
else if(t.dataset.s!==undefined){stk=t.dataset.s;drawStk();drawPreview()}
else if(t.id==='add')openDlg();
else if(t.id==='login')openLogin();
else if(t.id==='logout')sb.auth.signOut().then(function(){user=null;owner=false;load()});
else if(t.id==='import'){
  t.disabled=true;
  var lbs = localBooks();
  if(lbs.length){
    sb.from('books').insert(lbs.map(b=>({...b, id: 'b'+Date.now()+Math.random().toString(36).slice(2,5)})))
    .then(function(){
      try{localStorage.removeItem(LOCAL_KEY)}catch(x){}
      toast('Imported ✦');
      load();
    });
  }
}
else if(t.dataset.id){var bk=books.filter(function(b){return b.id===t.dataset.id})[0];if(bk){if(owner&&view!=='review')openDlg(bk);else openView(bk)}}
});

$('#file').addEventListener('change',function(){var f=this.files[0];if(f)resize(f,function(d){cover=d;drawPreview()})});
$('#title').addEventListener('input',function(){if(!cover)drawPreview()});
$('#status').addEventListener('change',syncStatus);
$('#cancel').addEventListener('click',function(){$('#dlg').close()});

$('#save').addEventListener('click',async function(){
var t=$('#title').value.trim();if(!t){$('#title').focus();return}
var st=$('#status').value,btn=this;
var d={title:t,author:$('#author').value.trim(),pages:Math.max(0,parseInt($('#pages').value)||0),cur:st==='reading'?Math.max(0,parseInt($('#cur').value)||0):0,status:st,cover:cover,stk:stk,rating:st==='read'?rating:0,review:st==='read'?$('#review').value.trim():''};
btn.disabled=true;

if(editing){
  await sb.from('books').update(d).eq('id', editing.id);
} else {
  d.id = 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  await sb.from('books').insert([d]);
}
btn.disabled=false;
$('#dlg').close();
load();
toast('Saved ✦');
});

$('#del').addEventListener('click',async function(){
if(!editing||!confirm('Remove this book from the shelf? 🥺'))return;
await sb.from('books').delete().eq('id', editing.id);
$('#dlg').close();
load();
toast('Removed!');
});


(function(){var em=['🍂','🍓','🍁','✨','🌸','💙','🐾'];for(var i=0;i<12;i++){var s=document.createElement('span');s.className='fall';s.textContent=em[i%em.length];s.style.left=(Math.random()*96)+'vw';s.style.fontSize=(14+Math.random()*16)+'px';s.style.animationDuration=(14+Math.random()*14)+'s';s.style.animationDelay=(-Math.random()*20)+'s';document.body.appendChild(s)}})();

load();
})();
</script>
</body>
</html>
