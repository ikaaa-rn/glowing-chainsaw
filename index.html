<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Autumn Reads 🍂</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style id="st">
    :root{--bg:#fff0f3;--card:#fffafb;--ink:#4a1d2a;--mute:#a4687b;--line:#f6c9d4;--accent:#e63357;--accent-ink:#fff;--green:#4e9b5c;--blue:#7cc0ee;--shadow:0 4px 14px rgba(230,51,87,.14)}
    @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0e17;--card:#3b1824;--ink:#ffe8ee;--mute:#dba5b4;--line:#5c2a3a;--accent:#ff6f8c;--accent-ink:#3a0b16;--green:#8fd69a;--blue:#8cc8f0;--shadow:0 4px 14px rgba(0,0,0,.4)}}
    :root[data-theme="dark"]{--bg:#2a0e17;--card:#3b1824;--ink:#ffe8ee;--mute:#dba5b4;--line:#5c2a3a;--accent:#ff6f8c;--accent-ink:#3a0b16;--green:#8fd69a;--shadow:0 4px 14px rgba(0,0,0,.4)}
    *{box-sizing:border-box}
    html{scroll-padding-top:env(safe-area-inset-top,0px)}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,"Trebuchet MS",system-ui,sans-serif;background-image:radial-gradient(var(--line) 1.6px,transparent 1.6px);background-size:24px 24px}
    h1,h2,h3,.cover span{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;margin:0;line-height:1.15}
    .wrap{max-width:960px;margin:0 auto;padding:28px 18px 60px;position:relative;z-index:1}
    .hero{text-align:center;padding:26px 0 30px}
    .hero h1{font-size:clamp(34px,7vw,52px);font-weight:700;background:linear-gradient(90deg,var(--accent),var(--blue),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.5px}
    .hero p{max-width:440px;margin:12px auto 0;color:var(--mute)}
    .hero .hi{font-size:clamp(17px,3.6vw,21px);font-weight:700;color:var(--ink);max-width:560px}
    .hero .aes{font-size:13px;letter-spacing:.3px;line-height:1.8;max-width:560px}
    .stat{display:inline-block;margin-top:14px;background:var(--card);border:2px dashed var(--line);border-radius:999px;padding:6px 16px;font-size:14px;font-weight:700;color:var(--green)}
    .tiles{display:grid;grid-template-columns:1fr;gap:10px;max-width:560px;margin:0 auto}
    .tile{background:color-mix(in srgb,var(--tc) 24%,var(--card));border:2px solid var(--line);border-radius:26px;padding:10px 18px;text-align:left;cursor:pointer;box-shadow:var(--shadow);color:inherit;font:inherit;transition:transform .15s;display:flex;align-items:center;gap:12px;width:100%}
    .tile:nth-child(1){--tc:#ff7fa8}.tile:nth-child(2){--tc:#8cc8f0}.tile:nth-child(3){--tc:#f7d96a}.tile:nth-child(4){--tc:#8fd69a}
    .tile:nth-child(odd){transform:rotate(-.4deg)}.tile:nth-child(even){transform:rotate(.4deg)}
    .tile:hover{transform:translateY(-2px) rotate(0)}
    .tile .ic{display:inline-block;font-size:24px;line-height:1}
    .tile:hover .ic{animation:wig .5s}
    @keyframes wig{25%{transform:rotate(-14deg) scale(1.2)}75%{transform:rotate(14deg) scale(1.2)}}
    .tile h2{font-size:18px;margin:0;flex:1}.tile .n{color:var(--mute);margin:0;font-size:13px;white-space:nowrap}
    .tile .n:last-child{color:var(--green);font-weight:700}
    .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
    .top h2{font-size:30px;flex:1;min-width:150px;color:var(--accent)}
    button{font:inherit;cursor:pointer}
    .btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:10px 18px;font-weight:600;box-shadow:0 3px 0 rgba(0,0,0,.15)}
    .btn:active{transform:translateY(2px)}
    .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
    .btn.danger{background:transparent;color:#c0392b;border:1px solid var(--line)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px}
    .book{background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer}
    .cover{aspect-ratio:2/3;border-radius:8px 12px 12px 8px;overflow:hidden;box-shadow:var(--shadow);background:var(--line);display:flex;align-items:center;justify-content:center;border-left:4px solid var(--green);position:relative}
    .cover img{width:100%;height:100%;object-fit:cover;display:block}
    .cover span{font-size:44px;color:#fff;font-weight:700}
    .book .t{font-weight:600;margin-top:8px;font-size:14px;line-height:1.3}
    .book .a{color:var(--mute);font-size:13px}
    .stars{color:var(--accent);letter-spacing:1px}
    .empty{text-align:center;color:var(--mute);padding:50px 10px;border:1.5px dashed var(--line);border-radius:16px}
    .reviews{display:grid;gap:16px}
    .rev{display:flex;height:260px;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);cursor:pointer;text-align:left;color:inherit;width:100%}
    .rev .cover{width:84px;height:126px;flex:none}.rev .cover span{font-size:28px}
    .rev .rev-content{min-width:0;flex:1}
    .rev h3{font-size:19px;line-height:22px;height:44px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
    .rev p{margin:8px 0 0;white-space:pre-wrap;color:var(--ink);line-height:22px;height:66px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;overflow-wrap:anywhere}
    .rev .rev-pages{height:20px}
    .rev .read-review{display:block;color:var(--accent);font-size:12px;font-weight:700;margin-top:6px}
    .rev:hover{border-color:var(--accent)}
    .pg{font-size:12px;color:var(--mute);font-weight:700;margin-top:2px}
    .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
    .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:99px}
    .stk{position:absolute;left:4px;top:4px;font-style:normal;font-size:16px;line-height:1;background:rgba(255,255,255,.88);border-radius:999px;padding:4px 5px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
    .stks{display:flex;flex-wrap:wrap;gap:6px}
    .stks button{width:38px;height:38px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:18px;padding:0;color:var(--mute)}
    .stks button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--card));transform:scale(1.08)}
    dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);padding:0;width:min(480px,94vw);max-height:92vh}
    dialog::backdrop{background:rgba(0,0,0,.5)}
    form{padding:22px;display:grid;gap:12px}
    label{font-size:13px;color:var(--mute);display:grid;gap:5px}
    input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
    input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
    textarea{min-height:110px;resize:vertical}
    .row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
    .pick{display:flex;gap:14px;align-items:center}.pick .cover{width:70px;flex:none}.pick .cover span{font-size:24px}
    .rate{display:flex;gap:4px}
    .rate button{background:none;border:0;font-size:28px;color:var(--line);padding:0 2px}
    .rate button.on{color:var(--accent)}
    .foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
    .note{color:var(--mute);font-size:12px;text-align:center;margin-top:34px}
    .lnk{background:none;border:0;padding:0 2px;color:var(--accent);font-weight:700;text-decoration:underline dotted}
    #vb{padding:22px;overflow-wrap:anywhere}.vh{display:flex;gap:16px;margin-bottom:12px}.vh .cover{width:96px;flex:none}.vh h3{font-size:22px}
    #toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
    #toast.show{opacity:1;transform:translate(-50%,0)}
    .fall{position:fixed;top:-8vh;pointer-events:none;z-index:0;opacity:.55;animation:fall linear infinite}
    @keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}

<body>
  <div class="wrap" id="app"></div>

  <!-- Modal Dialog Edit Buku -->
  <dialog id="dlg">
    <form id="f" method="dialog" onsubmit="return false">
      <h3 id="dt">A new book, yay! 📚</h3>
      <div class="pick">
        <div class="cover" id="pv"><span>📖</span></div>
        <label style="flex:1">Cover photo 🖼️ <input type="file" id="file" accept="image/*"></label>
      </div>
      <label>Title<input id="title" required></label>
      <label>Author<input id="author"></label>
      <div class="row">
        <label>Total pages 📄 <input id="pages" type="number" min="1" inputmode="numeric" placeholder="320"></label>
        <label id="curl">Current page<input id="cur" type="number" min="0" inputmode="numeric" placeholder="120"></label>
      </div>
      <label>Cover sticker 🏷️</label><div class="stks" id="stks"></div>
      <label>Status <select id="status">
        <option value="read">Finished 🏆</option>
        <option value="reading">Currently reading 📖</option>
        <option value="wish">Book wishlist 💭</option>
      </select></label>
      <div id="rwrap">
        <label>Rating ⭐️</label>
        <div class="rate" id="rate"></div>
        <label style="margin-top:10px">My review ✍️ <textarea id="review" placeholder="The plot twist, the feelings, the favorite quotes—write it all here..."></textarea></label>
      </div>
      <div class="foot">
        <button class="btn danger" id="del" type="button">Remove 🗑️</button>
        <button class="btn ghost" id="cancel" type="button">Cancel</button>
        <button class="btn" id="save" type="button">Save 💾</button>
      </div>
    </form>
  </dialog>

  <dialog id="vdlg"><div id="vb"></div></dialog>

  <!-- Modal Login Owner -->
  <dialog id="ldlg">
    <form id="lf" onsubmit="return false">
      <h3>Owner Login 🔒</h3>
      <p id="lmsg" style="color:var(--accent);font-size:13px"></p>
      <label>Email <input id="lemail" type="email" autocomplete="email" required></label>
      <label>Password <input id="lpass" type="password" autocomplete="current-password" required></label>
      <div class="foot">
        <button class="btn ghost" id="lcancel" type="button">Cancel</button>
        <button class="btn" id="lgo" type="submit">Log in</button>
      </div>
    </form>
  </dialog>

  <script>
    // ⚠️ ISI DENGAN PROJEC_URL & ANON_KEY DARI SUPABASE MILIKMU ⚠️
    const SUPABASE_URL = "https://zjvglbqchhpnkfflldsn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_qWjoXTwUz35UclKTz5sarQ_sgJ733JW";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let books = [], view = 'home', editing = null, cover = '', rating = 0, stk = '', user = null;

    const $ = s => document.querySelector(s);
    function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function toast(t){let e=$('#toast')||document.createElement('div');e.id='toast';e.textContent=t;document.body.appendChild(e);e.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',4000)}

    async function load() {
      const { data, error } = await sb.from('books').select('*').order('created_at', { ascending: false });
      if (!error) books = data || [];
      const { data: { session } } = await sb.auth.getSession();
      user = session?.user || null;
      render();
    }

    const COLORS = ['#b4532a','#3d6b5e','#5b4b8a','#a1405a','#2f5d8a','#8a6d1f','#4d6a2f'];
    function coverHTML(b){
      if(b.cover) return '<div class="cover"><img alt="" src="'+esc(b.cover)+'">'+stkHTML(b)+'</div>';
      let h=0, t=b.title||'?'; for(let i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))|0;
      return '<div class="cover" style="background:'+COLORS[Math.abs(h)%COLORS.length]+'"><span>'+esc(t.charAt(0).toUpperCase())+'</span>'+stkHTML(b)+'</div>';
    }
    function stars(n){return n?'<span class="stars">'+'★'.repeat(n)+'☆'.repeat(5-n)+'</span>':''}
    function stkHTML(b){return b.stk?'<em class="stk">'+esc(b.stk)+'</em>':''}
    function plural(n,w){return n.toLocaleString('en-US')+' '+w+(n===1?'':'s')}
    function pgHTML(b){
      let p=+b.pages||0, c=+b.cur||0; if(!p) return '';
      if(b.status==='reading'){
        let pc=Math.min(100,Math.round(c/p*100));
        return '<div class="pg">📖 '+c+'/'+p+' pages ('+pc+'%)</div><div class="bar"><i style="width:'+pc+'%"></i></div>';
      }
      return '<div class="pg">📄 '+plural(p,'page')+'</div>';
    }

    const SECTIONS = {
      read:{name:'Finished',ic:'🏆',st:'read',empty:'No finished books yet — one chapter at a time!'},
      review:{name:'Review',ic:'✍️',st:'read',empty:'No reviews yet — finished books with a review show up here.'},
      reading:{name:'Currently Reading',ic:'📖',st:'reading',empty:'Nothing on the nightstand right now...'},
      wish:{name:'Book Wishlist',ic:'💭',st:'wish',empty:'The wishlist is empty for now ✨'}
    };

    function list(k){
      if(k==='review') return books.filter(b=>b.status==='read'&&b.review&&b.review.trim());
      return books.filter(b=>b.status===SECTIONS[k].st);
    }

    function render(){
      const a = $('#app');
      if(view==='home'){
        let h = `<div class="hero"><div class="logo" role="img" aria-label="Autumn Reads logo"></div><h1>Autumn Reads 🍂</h1>
        <p class="hi">hello! 👋 this is my little bookish world 💕</p>
        <p class="aes">✨ Chapter 1. Speaks in: Footnotes & Daydreams.<br>(Bookmark No. 4) Pressed petals between every page. 🌸</p>
        <div class="stat">📚 ${plural(books.filter(b=>b.status==='read').length,'book')} finished • ${plural(books.filter(b=>b.status==='read').reduce((s,b)=>s+(+b.pages||0),0),'page')} read</div></div><div class="tiles">`;
        
        ['read','review','reading','wish'].forEach(k=>{
          h += `<button class="tile" onclick="go('${k}')"><div class="ic">${SECTIONS[k].ic}</div><h2>${SECTIONS[k].name}</h2><div class="n">${plural(list(k).length,'book')} ➔</div></button>`;
        });
        
        a.innerHTML = h + `</div><p class="note" style="margin-top:20px">${user ? `Owner mode 🔑 (${esc(user.email)}) • <button class="lnk" onclick="logout()">Log out</button>` : `Thanks for peeking at my shelf 🍂 <button class="lnk" onclick="openLogin()">Owner login</button>`}</p>`;
        return;
      }

      const S = SECTIONS[view], items = list(view);
      let h = `<div class="top"><button class="btn ghost" onclick="go('home')">⬅ Back</button><h2>${S.ic} ${S.name}</h2>${user ? `<button class="btn" onclick="openDlg()">+ Add book</button>` : ''}</div>`;
      
      if(!items.length) h += `<div class="empty">${S.empty}</div>`;
      else if(view==='review'){
        h += `<div class="reviews">${items.map(b => `
          <button class="rev" type="button" onclick="openView('${b.id}')">
            ${coverHTML(b)}
            <div class="rev-content">
              <h3>${esc(b.title)}</h3>
              <div class="a">${esc(b.author)}</div>
              <div>${stars(b.rating)}</div>
              <div class="rev-pages">${pgHTML(b)}</div>
              <p>${esc(b.review)}</p>
              <span class="read-review">Read full review ➔</span>
            </div>
          </button>
        `).join('')}</div>`;
      } else {
        h += `<div class="grid">${items.map(b => `
          <button class="book" onclick="${user ? `editDlg('${b.id}')` : `openView('${b.id}')`}">
            ${coverHTML(b)}
            <div class="t">${esc(b.title)}</div>
            <div class="a">${esc(b.author)}</div>
            ${b.status==='read' ? `<div>${stars(b.rating)}</div>` : ''}
            ${pgHTML(b)}
          </button>
        `).join('')}</div>`;
      }
      a.innerHTML = h;
    }

    function go(v){ view=v; render(); window.scrollTo(0,0); }

    function openView(id){
      const b = books.find(x=>x.id===id); if(!b) return;
      const LBL = {read:'Finished', reading:'Currently reading', wish:'Book wishlist'};
      $('#vb').innerHTML = `<div class="vh">${coverHTML(b)}<div><h3>${esc(b.title)}</h3><div class="a">${esc(b.author)}</div><div>${b.status==='read'?stars(b.rating):''}</div>${pgHTML(b)}<div class="pg">🏷️ ${LBL[b.status]}</div></div></div>${b.review ? `<p style="white-space:pre-wrap;margin:0 0 8px">${esc(b.review)}</p>`:''}<div class="foot"><button class="btn" onclick="$('#vdlg').close()">Close</button></div>`;
      $('#vdlg').showModal();
    }

    function drawRate(){ $('#rate').innerHTML=[1,2,3,4,5].map(i=>`<button type="button" onclick="setRate(${i})" class="${i<=rating?'on':''}">★</button>`).join(''); }
    function setRate(n){ rating = rating === n ? 0 : n; drawRate(); }
    function drawStk(){ $('#stks').innerHTML=['','🌸','🎀','⭐','☕','🕊️','🍂'].map(s=>`<button type="button" onclick="setStk('${s}')" class="${s===stk?'on':''}">${s||'❌'}</button>`).join(''); }
    function setStk(s){ stk=s; drawStk(); drawPreview(); }
    function drawPreview(){ $('#pv').outerHTML = coverHTML({title:$('#title').value||'?',cover:cover,stk:stk}).replace('class="cover"','class="cover" id="pv"'); }
    function syncStatus(){ let s=$('#status').value; $('#rwrap').style.display=s==='read'?'block':'none'; $('#curl').style.display=s==='reading'?'grid':'none'; }

    function openDlg(b=null){
      editing = b || null; stk = b ? b.stk||'' : ''; cover = b ? b.cover||'' : ''; rating = b ? b.rating||0 : 0;
      $('#dt').textContent = b ? 'Edit book 📝' : 'A new book, yay! 📚';
      $('#title').value = b ? b.title : ''; $('#author').value = b ? b.author : '';
      $('#status').value = b ? b.status : (SECTIONS[view] ? SECTIONS[view].st : 'read');
      $('#review').value = b ? b.review||'' : ''; $('#pages').value = b&&b.pages ? b.pages : ''; $('#cur').value = b&&b.cur ? b.cur : ''; $('#file').value = '';
      $('#del').style.display = b ? 'inline-block' : 'none';
      drawRate(); drawStk(); drawPreview(); syncStatus(); $('#dlg').showModal();
    }
    function editDlg(id){ const b = books.find(x=>x.id===id); if(b) openDlg(b); }

    $('#file').addEventListener('change', function(){
      let f = this.files[0];
      if(f){
        let r = new FileReader();
        r.onload = function(){
          let im = new Image();
          im.onload = function(){
            let w=360, sc=Math.min(1,w/im.width), c=document.createElement('canvas');
            c.width = Math.round(im.width*sc); c.height = Math.round(im.height*sc);
            c.getContext('2d').drawImage(im,0,0,c.width,c.height);
            cover = c.toDataURL('image/jpeg', 0.82); drawPreview();
          }; im.src = r.result;
        }; r.readAsDataURL(f);
      }
    });

    $('#title').addEventListener('input', drawPreview);
    $('#status').addEventListener('change', syncStatus);
    $('#cancel').onclick = () => $('#dlg').close();

    $('#save').onclick = async function(){
      let t = $('#title').value.trim(); if(!t){ $('#title').focus(); return; }
      let st = $('#status').value, btn = this; btn.disabled = true;
      let d = {
        title: t, author: $('#author').value.trim(),
        pages: Math.max(0, parseInt($('#pages').value)||0),
        cur: st==='reading' ? Math.max(0, parseInt($('#cur').value)||0) : 0,
        status: st, cover: cover, stk: stk,
        rating: st==='read' ? rating : 0,
        review: st==='read' ? $('#review').value.trim() : ''
      };
      if(editing){
        await sb.from('books').update(d).eq('id', editing.id);
      } else {
        d.id = 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
        await sb.from('books').insert([d]);
      }
      btn.disabled = false; $('#dlg').close(); load(); toast('Saved 💾');
    };

    $('#del').onclick = async function(){
      if(editing && confirm('Remove this book from the shelf? 🗑️')){
        await sb.from('books').delete().eq('id', editing.id);
        $('#dlg').close(); load(); toast('Removed!');
      }
    };

    function openLogin(){ $('#ldlg').showModal(); }
    $('#lcancel').onclick = () => $('#ldlg').close();
    $('#lf').onsubmit = async function(){
      let email = $('#lemail').value, password = $('#lpass').value;
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error) $('#lmsg').textContent = error.message;
      else { user = data.user; $('#ldlg').close(); render(); toast('Welcome back owner! ✨'); }
    };

    async function logout(){ await sb.auth.signOut(); user = null; render(); toast('Logged out!'); }

    // Hiasan Daun Gugur
    (function(){
      let em=['🍂','🌸','🍁'];
      for(let i=0;i<10;i++){
        let s=document.createElement('span'); s.className='fall'; s.textContent=em[i%em.length];
        s.style.left=(Math.random()*96)+'vw'; s.style.fontSize=(14+Math.random()*16)+'px';
        s.style.animationDuration=(14+Math.random()*14)+'s'; s.style.animationDelay=(-Math.random()*20)+'s';
        document.body.appendChild(s);
      }
    })();

    load();
  </script>
</body>
</html>
